# nl-be overlay. Regional catalogues carry only what differs from the
# parent: a label resolves through nl-be, then nl, then en, key by key,
# so a copy of the parent's string overrides nothing today and pins this
# locale to it the moment the parent is reworded.
# 35 such copies were removed; what remains genuinely differs.
#
# The file itself stays even when nothing differs: its presence is what
# registers the locale in installed_languages, and so in the picker.

[labels]
app.name = Start
errors.cannot_play_against_yourself = Kan niet tegen jezelf spelen
errors.message_cannot_be_empty = Bericht kan niet leeg zijn
errors.not_your_turn = Niet jouw beurt
errors.you_already_offered_a_draw = Je hebt reeds remise aangeboden
errors.no_draw_offer_to_accept = Geen remise-aanbod om te accepteren
errors.no_draw_offer_to_decline = Geen remise-aanbod om te weigeren
errors.you_already_accepted_the_score = Je hebt de score reeds aanvaard
